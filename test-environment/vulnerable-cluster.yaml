apiVersion: v1
kind: Namespace
metadata:
  name: apv-security-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vulnerable-sa
  namespace: apv-security-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apv-overprivileged-role
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apv-overprivileged-binding
subjects:
  - kind: ServiceAccount
    name: vulnerable-sa
    namespace: apv-security-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apv-overprivileged-role
---
apiVersion: v1
kind: Secret
metadata:
  name: dummy-sensitive-secret
  namespace: apv-security-test
type: Opaque
stringData:
  username: test-user
  password: dummy-password-not-real
---
apiVersion: v1
kind: Pod
metadata:
  name: vulnerable-pod
  namespace: apv-security-test
spec:
  serviceAccountName: vulnerable-sa
  automountServiceAccountToken: true
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
